name: Fetch open-access PDFs

# Lanzar a mano: pestana Actions > "Fetch open-access PDFs" > Run workflow.
# Descarga solo copias de acceso abierto legales (via OpenAlex / Europe PMC /
# enlaces directos de documentos oficiales). No usa credenciales de nadie.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write script and reference list
        run: |
          cat > fetch_oa.py <<'PYEOF'
          #!/usr/bin/env python3
          """Descarga PDF de acceso abierto legal para la bibliografia de la revision.

          Para cada DOI pregunta a OpenAlex que copias de acceso abierto existen
          (editorial, PMC, repositorios), y prueba cada candidata hasta obtener un PDF
          de verdad (cabecera %PDF y tamano minimo). No usa credenciales de nadie, no
          intenta saltarse muros de pago ni proteccion anti-bot: si una editorial
          responde 403, se anota y se sigue. Pausas entre peticiones.
          Solo libreria estandar. Se puede relanzar: salta lo que ya esta en pdfs/.
          """
          import csv, json, os, re, sys, time, urllib.error, urllib.parse, urllib.request

          UA = ("repellent-library-fetcher/1.0 (revision bibliografica; "
                "https://github.com/vcasana1/repellent-library)")
          DELAY = float(os.environ.get("FETCH_DELAY", "3"))   # s entre peticiones a editoriales
          MIN_BYTES = 30_000
          MAX_BYTES = 80_000_000
          LIST = os.environ.get("FETCH_LIST", "fetch_list.csv")
          OUT = "pdfs"
          REPORT = "report/fetch_report.csv"


          def get(url, timeout=60):
              """(status, content_type, bytes, final_url) o lanza excepcion."""
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "*/*"})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  data = r.read(MAX_BYTES + 1)
                  return r.status, r.headers.get("Content-Type", ""), data, r.geturl()


          def is_pdf(data):
              return data[:5] == b"%PDF-" and MIN_BYTES <= len(data) <= MAX_BYTES


          def openalex_candidates(doi):
              """URLs candidatas de PDF segun OpenAlex, mas notas de diagnostico."""
              q = urllib.parse.quote(doi, safe="/")
              url = ("https://api.openalex.org/works?filter=doi:" + q +
                     "&per-page=1&select=open_access,best_oa_location,locations,ids")
              try:
                  _, _, data, _ = get(url, timeout=40)
                  res = json.loads(data).get("results") or []
              except Exception as e:                      # red, JSON, 4xx...
                  return [], f"openalex_error:{type(e).__name__}"
              time.sleep(0.3)
              if not res:
                  return [], "openalex_no_record"
              w = res[0]
              cands = []
              best = (w.get("best_oa_location") or {}).get("pdf_url")
              if best:
                  cands.append(best)
              for loc in w.get("locations") or []:
                  if loc.get("is_oa") and loc.get("pdf_url"):
                      cands.append(loc["pdf_url"])
              pmc = (w.get("ids") or {}).get("pmcid") or ""
              m = re.search(r"PMC\d+", pmc, re.I)
              if m:
                  cands.append("https://europepmc.org/backend/ptpmcrender.fcgi?accid="
                               f"{m.group(0).upper()}&blobtype=pdf")
              is_oa = (w.get("open_access") or {}).get("is_oa")
              if is_oa and doi.startswith(("10.1186/", "10.1007/")):
                  cands.append(f"https://link.springer.com/content/pdf/{urllib.parse.quote(doi, safe='/')}.pdf")
              seen, uniq = set(), []
              for c in cands:
                  if c not in seen:
                      seen.add(c)
                      uniq.append(c)
              note = "oa" if is_oa else "openalex_not_oa"
              return uniq, note


          def try_download(cands):
              """Devuelve (bytes|None, url_usada, motivo)."""
              last = "sin_candidatas"
              for u in cands:
                  try:
                      status, ctype, data, final = get(u)
                  except urllib.error.HTTPError as e:
                      last = f"http_{e.code}"
                  except Exception as e:
                      last = type(e).__name__
                  else:
                      if is_pdf(data):
                          return data, final, "ok"
                      last = "no_es_pdf" if len(data) >= 1000 else "respuesta_corta"
                  time.sleep(DELAY)
              return None, "", last


          def main():
              os.makedirs(OUT, exist_ok=True)
              os.makedirs(os.path.dirname(REPORT), exist_ok=True)
              rows = list(csv.DictReader(open(LIST, encoding="utf-8")))
              limit = int(os.environ.get("FETCH_LIMIT", "0")) or len(rows)
              rows = rows[:limit]
              rep = []
              n_ok = 0
              for i, r in enumerate(rows, 1):
                  key, doi, fn, url = r["key"], r["doi"].strip(), r["pdf_filename"], r["url"].strip()
                  path = os.path.join(OUT, fn)
                  if os.path.exists(path) and os.path.getsize(path) >= MIN_BYTES:
                      rep.append([key, doi, "ya_estaba", "", os.path.getsize(path), ""])
                      n_ok += 1
                      print(f"[{i}/{len(rows)}] {key}: ya estaba", flush=True)
                      continue
                  cands, note = [], ""
                  if doi:
                      cands, note = openalex_candidates(doi)
                  if url and not doi:                      # sin DOI: enlace directo (docs oficiales)
                      cands = [url]
                      note = "url_directa"
                  data, used, why = try_download(cands)
                  if data:
                      tmp = path + ".part"
                      with open(tmp, "wb") as f:
                          f.write(data)
                      os.replace(tmp, path)
                      n_ok += 1
                      rep.append([key, doi, "ok", used, len(data), note])
                      print(f"[{i}/{len(rows)}] {key}: OK {len(data)//1024} KB <- {used[:70]}", flush=True)
                  else:
                      status = "sin_copia_abierta" if note in ("openalex_not_oa", "openalex_no_record") and not cands else "fallo"
                      rep.append([key, doi, status, ";".join(cands)[:300], 0, f"{note}|{why}"])
                      print(f"[{i}/{len(rows)}] {key}: {status} ({note}|{why})", flush=True)
                  time.sleep(DELAY)
              with open(REPORT, "w", encoding="utf-8", newline="") as f:
                  w = csv.writer(f)
                  w.writerow(["key", "doi", "estado", "url_o_candidatas", "bytes", "nota"])
                  w.writerows(rep)
              print(f"\nTerminado: {n_ok}/{len(rows)} PDF obtenidos. Informe en {REPORT}", flush=True)


          if __name__ == "__main__":
              main()
          PYEOF
